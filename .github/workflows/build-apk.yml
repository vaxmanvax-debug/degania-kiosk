name: Build Degania Kiosk APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -20
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: Degania-Kiosk-v0.3-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DeganiaKiosk_v0.3.apk
          if gh release view v0.3.0-test >/dev/null 2>&1; then
            gh release upload v0.3.0-test DeganiaKiosk_v0.3.apk --clobber
          else
            gh release create v0.3.0-test DeganiaKiosk_v0.3.apk --target "$GITHUB_SHA" --title "Degania Kiosk v0.3 — Android test" --notes "Correct website: https://degania-sprayers.com/. PIN setup on first run. Five quick taps open administrator PIN. Android kiosk system lock requires Device Owner provisioning. PDFs not yet supported." --prerelease
          fi
