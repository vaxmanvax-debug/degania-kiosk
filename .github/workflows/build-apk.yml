name: Build Degania Kiosk APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Degania-Kiosk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish direct-download test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DeganiaKiosk.apk
          if gh release view v0.2.0-test >/dev/null 2>&1; then
            gh release upload v0.2.0-test DeganiaKiosk.apk --clobber
          else
            gh release create v0.2.0-test DeganiaKiosk.apk --target "$GITHUB_SHA" --title "Degania Kiosk 0.2 (Android test)" --notes "Test Android APK for degania-sprayers.com. First launch asks you to set a 4-8 digit PIN. Five fast taps show the exit PIN dialog. Device Owner setup is required for strict Android system lock-down." --prerelease
          fi
